name: Feature request
description: An idea that would make Nictate better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How would you like Nictate to help?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Anything else you have tried or considered.
